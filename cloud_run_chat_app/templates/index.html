<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OFFICIAL — 4 BN REME SUSTAINMENT GROUP CHAT</title>
  <style>
    :root {
      --bg-dark: #0b0f14;
      --bg-panel: #131a22;
      --bg-card: #18222d;
      --border: #2a394a;
      --accent-green: #22c55e;
      --accent-amber: #f59e0b;
      --accent-red: #ef4444;
      --accent-blue: #38bdf8;
      --text-primary: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: "JetBrains Mono", "Courier New", monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .classification-banner {
      background: #14532d;
      color: #dcfce7;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      padding: 6px 12px;
      border-bottom: 1px solid #166534;
    }
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }
    h1 {
      font-size: 1.15rem;
      letter-spacing: 0.05em;
      color: #f8fafc;
    }
    .subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-reset {
      background: #1e293b;
      color: #fca5a5;
      border: 1px solid #7f1d1d;
      padding: 8px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .btn-reset:hover {
      background: #7f1d1d;
      color: #ffffff;
    }
    main {
      max-width: 1040px;
      width: 100%;
      margin: 24px auto;
      padding: 0 20px;
      flex: 1;
    }
    .feed-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .ticket-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent-amber);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }
    .ticket-card.level-3 {
      border-left-color: var(--accent-red);
    }
    .ticket-card.level-2 {
      border-left-color: var(--accent-blue);
    }
    .ticket-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .ticket-id {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-amber);
    }
    .callsign {
      background: #0f172a;
      color: #38bdf8;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.82rem;
      border: 1px solid #1e3a8a;
      margin-left: 8px;
    }
    .status-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 4px;
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .status-badge.completed {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border-color: rgba(34, 197, 94, 0.4);
    }
    .grid-details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .field-box {
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #1e293b;
    }
    .field-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .field-value {
      font-size: 0.88rem;
      color: var(--text-primary);
      line-height: 1.35;
    }
    .ticket-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
    }
    .coords-text {
      font-size: 0.82rem;
      color: #cbd5e1;
    }
    .map-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn-maps {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #15803d;
      color: #ffffff;
      text-decoration: none;
      padding: 9px 16px;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 700;
      border: 1px solid #22c55e;
      transition: background 0.15s ease;
    }
    .btn-maps:hover {
      background: #16a34a;
    }
    .btn-maps-pin {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      color: #93c5fd;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid #3b82f6;
      transition: background 0.15s ease;
    }
    .btn-maps-pin:hover {
      background: #1d4ed8;
      color: #ffffff;
    }
    .btn-tts-uk {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1e293b;
      color: #fde68a;
      padding: 8px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid #f59e0b;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-tts-uk:hover {
      background: #b45309;
      color: #ffffff;
    }
    .ticket-photo-box {
      background: #0f172a;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #1e293b;
      margin-bottom: 12px;
    }
    .ticket-photo {
      display: block;
      max-width: 100%;
      max-height: 320px;
      border-radius: 6px;
      border: 1px solid var(--border);
      margin-top: 8px;
      object-fit: contain;
      background: #090d12;
    }
    .ticket-photo-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 6px;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="classification-banner">
    OFFICIAL — 4 BN REME SUSTAINMENT GROUP CHAT // BOWMAN DATA LINK FEED
  </div>
  <header>
    <div class="header-title">
      <div class="status-dot"></div>
      <div>
        <h1>4 BN REME — FORWARD REPAIR TEAM (FRT) DISPATCH FEED</h1>
        <div class="subtitle">Salisbury Plain Training Area (SPTA) • Live AESP &amp; NSN Requisition Stream</div>
      </div>
    </div>
    <div class="controls">
      <button id="reset-demo-btn" class="btn-reset" onclick="resetDemo()">[Reset Demo]</button>
    </div>
  </header>

  <main>
    <div class="feed-meta">
      <span id="ticket-count">ACTIVE TICKETS: {{ tickets|length }}</span>
      <span id="poll-status">LIVE POLLING: 1.0s (CONNECTED)</span>
    </div>
    <div id="tickets-container"></div>
  </main>

  <script>
    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function speakTicketBrief(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(String(text || ""));
      utterance.lang = "en-GB";
      const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
      const gbVoice = voices.find(v => String(v.lang || "").toLowerCase().startsWith("en-gb")) ||
                      voices.find(v => String(v.name || "").toLowerCase().includes("uk") || String(v.name || "").toLowerCase().includes("british"));
      if (gbVoice) {
        utterance.voice = gbVoice;
      }
      window.speechSynthesis.speak(utterance);
    }

    function renderTickets(tickets) {
      const container = document.getElementById("tickets-container");
      const countEl = document.getElementById("ticket-count");
      countEl.textContent = `ACTIVE TICKETS: ${tickets.length}`;

      container.innerHTML = tickets.map(ticket => {
        const isLevel3 = String(ticket.repair_classification || "").toLowerCase().includes("level 3");
        const isCompleted = String(ticket.status || "").toLowerCase().includes("completed");
        const cardClass = isLevel3 ? "ticket-card level-3" : "ticket-card level-2";
        const badgeClass = isCompleted ? "status-badge completed" : "status-badge";
        const mapsDirUrl = ticket.google_maps_url || `https://www.google.com/maps/dir/?api=1&destination=${ticket.latitude},${ticket.longitude}&travelmode=driving`;
        const mapsSearchUrl = `https://www.google.com/maps/search/?api=1&query=${ticket.latitude},${ticket.longitude}`;
        let imageSrc = ticket.image_url || "";
        if (!imageSrc && ticket.image_gcs_uri && String(ticket.image_gcs_uri).startsWith("gs://")) {
          const withoutScheme = String(ticket.image_gcs_uri).slice(5);
          const slashIdx = withoutScheme.indexOf("/");
          if (slashIdx > 0) {
            imageSrc = `/api/ticket-image/${withoutScheme.slice(slashIdx + 1)}`;
          }
        }
        const photoSectionHtml = imageSrc ? `
            <div class="ticket-photo-box">
              <div class="field-label">FIELD CASUALTY PHOTOGRAPH (ATTACHED TO TICKET)</div>
              <a href="${escapeHtml(imageSrc)}" target="_blank" rel="noopener noreferrer">
                <img class="ticket-photo" src="${escapeHtml(imageSrc)}" alt="Attached Casualty Photograph for ${escapeHtml(ticket.ticket_id)}" loading="lazy" />
              </a>
              ${ticket.image_gcs_uri ? `<div class="ticket-photo-meta">GCS ARCHIVE: ${escapeHtml(ticket.image_gcs_uri)}</div>` : ""}
            </div>
        ` : "";

        return `
          <article class="${cardClass}" data-ticket-id="${escapeHtml(ticket.ticket_id)}">
            <div class="ticket-header">
              <div>
                <span class="ticket-id">${escapeHtml(ticket.ticket_id)}</span>
                <span class="callsign">CALLSIGN: ${escapeHtml(ticket.callsign)}</span>
                <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 4px;">
                  LOGGED UTC: ${escapeHtml(ticket.created_at_utc)}
                </div>
              </div>
              <span class="${badgeClass}">${escapeHtml(ticket.status)}</span>
            </div>

            <div class="grid-details">
              <div class="field-box">
                <div class="field-label">REPAIR CLASSIFICATION</div>
                <div class="field-value">${escapeHtml(ticket.repair_classification)}</div>
              </div>
              <div class="field-box">
                <div class="field-label">AESP MANUAL REFERENCE</div>
                <div class="field-value">${escapeHtml(ticket.aesp_reference)}</div>
              </div>
              <div class="field-box">
                <div class="field-label">PART NOMENCLATURE</div>
                <div class="field-value">${escapeHtml(ticket.part_name)}</div>
              </div>
              <div class="field-box">
                <div class="field-label">NATO STOCK NUMBER (NSN)</div>
                <div class="field-value" style="color: #38bdf8; font-weight: 700;">${escapeHtml(ticket.nsn)}</div>
              </div>
            </div>

            <div class="field-box" style="margin-bottom: 10px;">
              <div class="field-label">TECHNICAL LIMITS &amp; SAFETY DIRECTIVES</div>
              <div class="field-value">${escapeHtml(ticket.technical_limits)}</div>
            </div>

            ${photoSectionHtml}

            <div class="ticket-footer">
              <div class="coords-text">
                <strong>GRID / LOCATION:</strong> ${escapeHtml(ticket.coords_label)}
                <br />
                <span>WGS84: ${Number(ticket.latitude).toFixed(4)}, ${Number(ticket.longitude).toFixed(4)}</span>
              </div>
              <div class="map-actions">
                <button type="button" class="btn-tts-uk" data-tts="${escapeHtml(`Callsign ${ticket.callsign}. Vehicle Location ${ticket.coords_label}. Grounded Manual ${ticket.aesp_reference}. Demand Component ${ticket.part_name}, NSN ${ticket.nsn}.`)}" onclick="speakTicketBrief(this.getAttribute('data-tts'))">
                  🔊 READ ALOUD (en-GB)
                </button>
                <a class="btn-maps" href="${escapeHtml(mapsDirUrl)}" target="_blank" rel="noopener noreferrer">
                  📍 DISPATCH FRT — GOOGLE MAPS NAVIGATION
                </a>
                <a class="btn-maps-pin" href="${escapeHtml(mapsSearchUrl)}" target="_blank" rel="noopener noreferrer">
                  🗺️ VIEW SECTOR PIN
                </a>
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    async function fetchTickets() {
      try {
        const res = await fetch("/api/tickets");
        if (!res.ok) return;
        const data = await res.json();
        renderTickets(data.tickets || []);
      } catch (err) {
        console.warn("Polling error:", err);
      }
    }

    async function resetDemo() {
      try {
        const res = await fetch("/api/reset", { method: "POST" });
        if (res.ok) {
          const data = await res.json();
          renderTickets(data.tickets || []);
        }
      } catch (err) {
        console.error("Reset error:", err);
      }
    }

    fetchTickets();
    setInterval(fetchTickets, 1000);
  </script>
</body>
</html>
